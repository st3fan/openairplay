[package]
name = "openairplay1-receiver"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Standalone AirPlay 1 (RAOP) receiver for Linux/ALSA"
license = "MIT"
repository = "https://github.com/st3fan/openairplay1"
readme = "../README.md"
keywords = ["airplay", "airplay1", "raop", "receiver", "alsa"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
# The version makes this publishable; the path keeps workspace builds local.
openairplay1 = { path = "../openairplay1", version = "0.2.0" }
alsa = "0.12"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
base64 = "0.23.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_json = "1.0.151"
openairplay1-dashboard-protocol = { version = "0.2.0", path = "../openairplay1-dashboard-protocol" }

[dev-dependencies]
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "connect"] }
