[package]
name = "openairplay1-dashboard"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "Full-screen now-playing display for an openairplay1 receiver"
license = "MIT"
repository = "https://github.com/st3fan/openairplay1"
readme = "../README.md"
keywords = ["airplay", "raop", "dashboard", "tui", "now-playing"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
openairplay1-dashboard-protocol = { version = "0.3.0", path = "../openairplay1-dashboard-protocol" }
base64 = "0.23.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
libc = "0.2.189"
log = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "connect"] }
